
name: Kernel Build CI (Ginkgo - Clang 15)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v3

    - name: Set up Environment
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential ccache curl flex git libncurses-dev libssl-dev python3 python-is-python3 rsync unzip zip zlib1g-dev

    - name: Download Clang 15
      run: |
        mkdir clang
        curl -LO https://github.com/itsHardChannel/Clang-15-Prebuilt/releases/download/15/clang-15.tar.gz
        tar -xf clang-15.tar.gz -C clang --strip-components=1

    - name: Download GCC Toolchains
      run: |
        git clone --depth=1 https://github.com/TheMuppets/aarch64-linux-android-4.9 gcc64
        git clone --depth=1 https://github.com/TheMuppets/arm-linux-androideabi-4.9 gcc32

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_PATH=$PWD/clang
        export CROSS_COMPILE=$PWD/gcc64/bin/aarch64-linux-android-
        export CROSS_COMPILE_ARM32=$PWD/gcc32/bin/arm-linux-androideabi-
        export PATH=$CLANG_PATH/bin:$PATH

        make O=out ginkgo_defconfig
        make -j$(nproc) O=out \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=$CROSS_COMPILE \
          CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v3
      with:
        name: Image.gz-dtb
        path: out/arch/arm64/boot/Image.gz-dtb
