name: Kernel Build CI (Ginkgo - Clang 15 + GCC 9.4)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Set up Environment
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison build-essential ccache curl flex git libncurses-dev \
          libssl-dev python3 python-is-python3 rsync unzip zip zlib1g-dev \
          gcc-9-aarch64-linux-gnu g++-9-aarch64-linux-gnu binutils-aarch64-linux-gnu

    - name: Set GCC 9.4 as default aarch64 toolchain
      run: |
        sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc aarch64-linux-gnu-gcc /usr/bin/aarch64-linux-gnu-gcc-9 100

    - name: Download latest LLVM prebuilt
      run: |
        mkdir clang
        curl -L https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/LLVM-20.1.8-Linux-X64.tar.xz -o clang.tar.xz
        tar -xf clang.tar.xz -C clang --strip-components=1

    - name: Clean AnyKernel3 if exists
      run: rm -rf AnyKernel3

    - name: Download AnyKernel3
      run: git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git

    - name: Build Kernel (Clang 15 + GCC 9.4)
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export PATH=$PWD/clang/bin:$PATH

        # Ensure defconfig exists or replace with your own (e.g. ginkgo_defconfig)
        make O=out defconfig

        # Build kernel
        make -j$(nproc) O=out \
          CC=clang \
          CROSS_COMPILE=$CROSS_COMPILE

    - name: Prepare flashable zip
      run: |
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb

    - name: Create flashable zip
      run: |
        cd AnyKernel3
        zip -r9 ../Ginkgo-Kernel.zip ./*

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-dtb
        path: out/arch/arm64/boot/Image.gz-dtb

    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Ginkgo-Kernel.zip
        path: Ginkgo-Kernel.zip
